[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchbridge"
version = "0.1.0"
description = "Local QC bridge helper and simulation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The QC transport is vendored from qc-mcp (vendor/qc-mcp/VENDORED.md); it needs protobuf.
usb = ["protobuf>=5.0"]

[project.scripts]
patchbridge-helper = "patchbridge.helper:main"

[tool.setuptools]
packages = ["patchbridge", "qc_mcp"]
package-dir = {"" = "src", "qc_mcp" = "vendor/qc-mcp/src/qc_mcp"}

[tool.setuptools.package-data]
# Generated locally, never committed; included when present.
qc_mcp = ["descriptors/*.pb"]
