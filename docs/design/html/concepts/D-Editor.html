<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>D · Block editor</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.87 0.17 115)}a:hover{color:oklch(0.93 0.12 115)}
button{font:inherit;color:inherit;cursor:pointer}
</style>

<style>html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#000}</style>
</head>
<body>


<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 16px 0; display: flex; flex-direction: column; background: radial-gradient(120% 60% at 50% 30%, oklch(0.3 0.07 27 / 0.75), transparent 70%), oklch(0.16 0.012 27); color: oklch(0.97 0.006 27); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="D-Overview.dc.html" style="height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 2px; border-radius: 22px; background: oklch(1 0 0 / 0.1); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; text-decoration: none; font-size: 15px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Clean Edge Lead
    </a>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
      Active
      <button type="button" role="switch" aria-checked="true" aria-label="Block active" style="width: 51px; height: 31px; padding: 2px; border: 0; border-radius: 16px; background: oklch(0.87 0.17 115); display: flex; justify-content: flex-end;">
        <span style="width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px oklch(0 0 0 / 0.3);"></span>
      </button>
    </label>
  </div>

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px;">
    <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: oklch(0.56 0.2 27); color: #fff; font-size: 11px; font-weight: 700; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.4);">AMP</span>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.1; font-weight: 700; letter-spacing: -0.015em;">Crunch 50</h1>
      <span style="font-size: 13px; color: oklch(0.82 0.02 27);">Row 1, slot 3 · Scene A</span>
    </div>
  </div>

  <div style="position: relative; margin-top: 16px; display: flex; flex-direction: column; align-items: center;">
    <span style="font-size: 19px; font-weight: 600;">Gain</span>
    <div style="position: relative; width: 240px; height: 222px;">
      <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Gain 6.4 of 10, sending, QC at 6.2" style="position: absolute; top: 0; left: 0;">
        <path d="M 52.12 187.88 A 96 96 0 1 1 187.88 187.88" fill="none" stroke="oklch(1 0 0 / 0.13)" stroke-width="16" stroke-linecap="round"></path>
        <path d="M 52.12 187.88 A 96 96 0 0 1 171.44 38.94" fill="none" stroke="oklch(0.74 0.16 27)" stroke-width="16" stroke-linecap="round"></path>
        <path d="M 171.44 38.94 A 96 96 0 0 1 178.84 44.15" fill="none" stroke="oklch(0.74 0.16 27)" stroke-width="16" stroke-dasharray="3 6" opacity="1"></path>
        <line x1="162.87" y1="52.45" x2="180.01" y2="25.44" stroke="oklch(0.97 0.006 27)" stroke-width="3" stroke-linecap="round" opacity="1"></line>
        <circle cx="178.84" cy="44.15" r="13" fill="#ffffff" stroke="oklch(0.16 0.012 27)" stroke-width="3"></circle>
      </svg>
      <button type="button" aria-label="Gain 6.4. Tap to type a value" style="position: absolute; left: 50%; top: 72px; transform: translateX(-50%); height: 76px; padding: 0 14px; display: flex; align-items: center; border: 0; border-radius: 20px; background: transparent; outline: 1.5px dashed oklch(0.87 0.17 115); outline-offset: -1.5px">
        <span style="font-size: 62px; line-height: 1; font-weight: 700; letter-spacing: -0.02em;">6.4</span>
        
      </button>
      <span style="position: absolute; left: 0; right: 0; top: 152px; text-align: center; font-size: 13px; color: oklch(0.82 0.02 27);">Tap number to type</span>
    </div>
    <button type="button" aria-label="Decrease gain by 0.1" style="position: absolute; left: 0; top: 196px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(1 0 0 / 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(1 0 0 / 0.06);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
    </button>
    <button type="button" aria-label="Increase gain by 0.1" style="position: absolute; right: 0; top: 196px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(1 0 0 / 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(1 0 0 / 0.06);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
    </button>
    <div style="margin-top: 8px; min-height: 20px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: oklch(0.87 0.17 115)">
      
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 3" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>
      
      
      
      <span>Sending 6.4. QC is still at 6.2</span>
    </div>
  </div>

  
    <div role="group" aria-label="Parameters" style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      
        <button type="button" aria-pressed="true" aria-label="Gain, 6.4" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid oklch(0.74 0.16 27); background: oklch(0.74 0.16 27 / 0.22); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Gain<span style="display: none"></span></span>
          <span style="font-size: 20px; font-weight: 600; color: inherit">6.4</span>
        </button>
      
        <button type="button" aria-pressed="false" aria-label="Bass, 5.0" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid transparent; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Bass<span style="display: none"></span></span>
          <span style="font-size: 20px; font-weight: 600; color: inherit">5.0</span>
        </button>
      
        <button type="button" aria-pressed="false" aria-label="Mid, 6.5" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid transparent; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Mid<span style="font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 5px; background: oklch(1 0 0 / 0.14)">QC</span></span>
          <span style="font-size: 20px; font-weight: 600; color: inherit">6.5</span>
        </button>
      
        <button type="button" aria-pressed="false" aria-label="Treble, 5.8" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid transparent; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Treble<span style="display: none"></span></span>
          <span style="font-size: 20px; font-weight: 600; color: inherit">5.8</span>
        </button>
      
        <button type="button" aria-pressed="false" aria-label="Presence, 4.0" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid transparent; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Presence<span style="display: none"></span></span>
          <span style="font-size: 20px; font-weight: 600; color: inherit">4.0</span>
        </button>
      
        <button type="button" aria-pressed="false" aria-label="Master, 7.0" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid transparent; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Master<span style="display: none"></span></span>
          <span style="font-size: 20px; font-weight: 600; color: inherit">7.0</span>
        </button>
      
        <button type="button" aria-pressed="false" aria-label="Channel, Crunch, option list" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid transparent; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Channel<span style="display: none"></span></span>
          <span style="font-size: 16px; font-weight: 600; color: inherit">Crunch</span>
        </button>
      
        <button type="button" aria-pressed="false" aria-label="Bright, Off, switch" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid transparent; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Bright<span style="display: none"></span></span>
          <span style="font-size: 16px; font-weight: 600; color: oklch(0.82 0.02 27)">Off</span>
        </button>
      
        <button type="button" aria-pressed="false" aria-label="Level, −3.0 dB" style="height: 62px; box-sizing: border-box; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border-radius: 18px; border: 1.5px solid transparent; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6)">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">Level<span style="display: none"></span></span>
          <span style="font-size: 16px; font-weight: 600; color: inherit">−3.0 dB</span>
        </button>
      
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: oklch(0.2 0.02 27 / 0.6); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-top: 1px solid oklch(1 0 0 / 0.08);">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(0.87 0.17 115);"></span>
        2 changes not saved
      </span>
      <button type="button" style="height: 50px; padding: 0 24px; border: 0; border-radius: 25px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); font-size: 16px; font-weight: 600; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5);">Save to 3B</button>
    </div>
  

  
</div>

</body>
