<html lang="en">

<div style="width: 402px; height: 874px; position: relative; overflow: hidden; box-sizing: border-box; padding: 62px 16px 0; display: flex; flex-direction: column; background: radial-gradient(120% 55% at 50% 34%, oklch(0.3 0.06 160 / 0.7), transparent 70%), oklch(0.16 0.012 160); color: oklch(0.96 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">

    <a href="#" style="height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 2px; border-radius: 999px; background: oklch(0.26 0.01 110 / 0.6); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; text-decoration: none; font-size: 15px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Tremonti w Mic

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px;">
    <span aria-hidden="true" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: oklch(0.68 0.12 160); color: oklch(0.17 0.02 160); font-size: 11px; font-weight: 700; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.4)">CMP</span>
    <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.1; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Opto Comp (M)</h1>
      <span style="font-size: 13px; color: oklch(0.76 0.01 110);">Compressor · Scene F</span>
    </div>
  </div>

  <section aria-label="Threshold control" style="position: relative; height: 288px; margin-top: 10px; display: flex; flex-direction: column; align-items: center;">
    <span style="font-size: 19px; font-weight: 600;">Threshold</span>

    
      <div style="position: relative; width: 240px; height: 222px;">
        <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Threshold −75 dB" style="position: absolute; top: 0; left: 0;">
          <path d="M 52.12 187.88 A 96 96 0 1 1 187.88 187.88" fill="none" stroke="oklch(1 0 0 / 0.13)" stroke-width="16" stroke-linecap="round"></path>
          <path d="M 52.12 187.88 A 96 96 0 0 1 60.8 44.42" fill="none" stroke="oklch(0.76 0.12 160)" stroke-width="16" stroke-linecap="round" opacity="1"></path>
          <path d="M 60.8 44.42 A 96 96 0 0 1 83.28 31.3" fill="none" stroke="oklch(0.76 0.12 160)" stroke-width="16" stroke-dasharray="3 6" opacity="0"></path>
          <line x1="70.67" y1="57.02" x2="50.94" y2="31.83" stroke="oklch(0.96 0.005 110)" stroke-width="3" stroke-linecap="round" opacity="0"></line>
          <circle cx="60.8" cy="44.42" r="24" fill="none" stroke="oklch(0.87 0.17 115)" stroke-width="2" opacity="0"></circle>
          <circle cx="60.8" cy="44.42" r="13" fill="#ffffff" stroke="oklch(0.16 0.008 110)" stroke-width="3"></circle>
        </svg>
        <button type="button" aria-label="Threshold −75 dB. Tap to type a value" style="position: absolute; left: 50%; top: 87px; transform: translateX(-50%); height: 66px; padding: 0 12px; box-sizing: border-box; display: flex; align-items: baseline; justify-content: center; gap: 5px; line-height: 66px; white-space: nowrap; border: 0; border-radius: 18px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 0 0 2px oklch(0.86 0.13 75); outline: none; outline-offset: -1.5px; color: oklch(0.96 0.005 110); font: inherit; cursor: text;">
          
          <span style="font-size: 48px; font-weight: 700; letter-spacing: -0.02em;">−75</span>
          
            <span aria-hidden="true" style="align-self: center; width: 3px; height: 40px; margin-left: -3px; border-radius: 2px; background: oklch(0.87 0.17 115);"></span>
          
          <span style="font-size: 18px; font-weight: 600; color: oklch(0.76 0.01 110);">dB</span>
        </button>
        
        <span style="position: absolute; left: 22px; top: 202px; font-size: 12px; color: oklch(0.76 0.01 110);">−60</span>
        <span style="position: absolute; right: 16px; top: 202px; font-size: 12px; color: oklch(0.76 0.01 110);">+12</span>
      </div>
      
        <button type="button" aria-label="Decrease threshold by 0.1" style="position: absolute; left: 0; top: 200px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(0.26 0.01 110 / 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; cursor: pointer;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <button type="button" aria-label="Increase threshold by 0.1" style="position: absolute; right: 0; top: 200px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(0.26 0.01 110 / 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; cursor: pointer;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
        </button>
      
    

    

    <div style="position: absolute; left: 0; right: 0; top: 262px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; text-align: center; color: oklch(0.86 0.13 75);">
      
      
      
      
      
      <span></span>
    </div>
  </section>

  

  
    <div role="dialog" aria-label="Type a value for Threshold" style="position: absolute; z-index: 40; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 10px 34px; display: flex; flex-direction: column; gap: 8px; border-radius: 28px 28px 0 0; background: oklch(0.22 0.01 110 / 0.78); backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), 0 -10px 30px oklch(0 0 0 / 0.4);">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px;">
        <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: inherit; font: inherit; font-size: 16px; cursor: pointer;">Cancel</button>
        <span style="font-size: 13px; color: oklch(0.86 0.13 75)">−60.0 to +12.0 dB</span>
        <span style="width: 64px;"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
        
          <button type="button" aria-label="1" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">1</button>
        
          <button type="button" aria-label="2" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">2</button>
        
          <button type="button" aria-label="3" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">3</button>
        
          <button type="button" aria-label="Delete" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 20px; cursor: pointer">⌫</button>
        
          <button type="button" aria-label="4" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">4</button>
        
          <button type="button" aria-label="5" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">5</button>
        
          <button type="button" aria-label="6" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">6</button>
        
          <button type="button" aria-label="Change sign" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">±</button>
        
          <button type="button" aria-label="7" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">7</button>
        
          <button type="button" aria-label="8" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">8</button>
        
          <button type="button" aria-label="9" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">9</button>
        
          <button type="button" aria-label="Decimal point" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer">.</button>
        
          <button type="button" aria-label="0" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; font: inherit; font-size: 24px; cursor: pointer; grid-column: span 3">0</button>
        
          <button type="button" aria-label="Set, unavailable until the value is in range" style="height: 50px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.06); box-shadow: none; color: oklch(0.76 0.01 110); font: inherit; font-size: 17px; cursor: not-allowed; font-weight: 600">Set</button>
        
      </div>
    </div>
  
</div>
