<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>Loading the QC</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<style>html,body{margin:0;width:1180px;height:820px;overflow:hidden;background:#000}</style>
</head>
<body>




<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; box-sizing: border-box; padding: 32px 20px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: oklch(0.16 0.008 110); color: oklch(0.96 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;">

  

  

  

  

  

  

  
    <div aria-hidden="true" style="position: absolute; inset: 32px 20px 20px; display: flex; flex-direction: column; gap: 16px;">
      <div style="height: 52px; display: flex; align-items: center; gap: 12px;">
        <span style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
          <span style="width: 240px; height: 28px; border-radius: 12px; background: oklch(1 0 0 / 0.07);"></span>
          <span style="width: 150px; height: 13px; border-radius: 999px; background: oklch(1 0 0 / 0.07);"></span>
        </span>
        <span style="width: 150px; height: 44px; border-radius: 999px; background: oklch(1 0 0 / 0.07);"></span>
        <span style="width: 228px; height: 50px; border-radius: 999px; background: oklch(1 0 0 / 0.07);"></span>
      </div>
      <div style="flex: 1; display: grid; gap: 14px 16px; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: 52px 332px minmax(0, 1fr);">
        <span style="border-radius: 15px; background: oklch(1 0 0 / 0.07);"></span>
        <span style="grid-row: span 3; border-radius: 28px; background: oklch(1 0 0 / 0.07);"></span>
        <span style="border-radius: 20px; background: oklch(1 0 0 / 0.07);"></span>
        <span style="display: flex; flex-direction: column; gap: 10px;">
          <span style="height: 52px; border-radius: 15px; background: oklch(1 0 0 / 0.07);"></span>
          <span style="height: 52px; border-radius: 15px; background: oklch(1 0 0 / 0.07); opacity: 0.7;"></span>
          <span style="height: 52px; border-radius: 15px; background: oklch(1 0 0 / 0.07); opacity: 0.45;"></span>
        </span>
      </div>
    </div>
    <div role="status" style="position: absolute; top: 400px; right: 20px; width: 400px; display: flex; justify-content: center; font-size: 17px; font-weight: 600;">Reading the QC…</div>
  

  
</div>


</body>
