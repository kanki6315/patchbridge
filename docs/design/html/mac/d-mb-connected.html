<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=340">
<title>Daylight · menu bar</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<style>html,body{margin:0;width:340px;height:322px;overflow:hidden;background:transparent}</style>
</head>
<body>




<div style="width: 340px; height: 322px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 15px; background: oklch(0.985 0.002 110 / 0.94); box-shadow: inset 0 0 0 1px oklch(0.2 0.01 110 / 0.12), 0 12px 32px oklch(0.2 0.01 110 / 0.14); color: oklch(0.2 0.01 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7)">

  

  
    <div style="box-sizing: border-box; padding: 14px 8px 8px; display: flex; flex-direction: column; gap: 10px;">
      <div style="padding: 0 8px; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 15px; font-weight: 700;">Patchbridge</span>
        <span role="status" style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: oklch(0.2 0.01 110);">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(0.48 0.12 115);"></span>
          
          
          Connected
        </span>
      </div>

      

      

      <div style="margin: 0 2px; border-radius: 12px; background: oklch(1 0 0); box-shadow: inset 0 0 0 1px oklch(0.2 0.01 110 / 0.07), 0 1px 3px oklch(0.2 0.01 110 / 0.06);">
        <div style="min-height: 56px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; gap: 12px;">
          <span style="width: 36px; height: 36px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: oklch(0.2 0.01 110 / 0.06); border: 0; color: oklch(0.2 0.01 110)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="6" width="3.6" height="3.6" rx="1"></rect><rect x="7.8" y="6" width="3.6" height="3.6" rx="1"></rect><rect x="12.6" y="6" width="3.6" height="3.6" rx="1"></rect><rect x="17.4" y="6" width="3.6" height="3.6" rx="1"></rect><rect x="3" y="11.4" width="3.6" height="3.6" rx="1" opacity="0.45"></rect><rect x="7.8" y="11.4" width="3.6" height="3.6" rx="1"></rect><rect x="12.6" y="11.4" width="3.6" height="3.6" rx="1" opacity="0.45"></rect><rect x="17.4" y="11.4" width="3.6" height="3.6" rx="1"></rect></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 600;">Crunch Lead</span>
            <span style="font-size: 12px; color: oklch(0.45 0.01 110);">My Presets 16 · CorOS 4.1.1</span>
          </span>
          
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(0.48 0.12 115);"></span>Unsaved</span>
          
        </div>
        <div style="min-height: 56px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; gap: 12px; border-top: 1px solid oklch(0.2 0.01 110 / 0.08);">
          <span style="width: 36px; height: 36px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: oklch(0.2 0.01 110 / 0.06); border: 0; color: oklch(0.2 0.01 110)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 600;">Jamie’s iPhone</span>
            <span style="font-size: 12px; color: oklch(0.45 0.01 110);">Approved 21:04</span>
          </span>
          
            <button type="button" style="height: 28px; padding: 0 12px; border: 0; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; background: oklch(0.2 0.01 110 / 0.06); color: #ba2c25">Disconnect</button>
          
        </div>
      </div>

      <div role="menu" aria-label="Patchbridge" style="display: flex; flex-direction: column;">
        
          
          <button type="button" role="menuitem" style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 9px; background: transparent; color: oklch(0.2 0.01 110); font: inherit; font-size: 14px; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 1px;">
              <span>Open Patchbridge</span>
              
            </span>
            <span style="font-size: 13px; color: oklch(0.45 0.01 110); font-variant-numeric: tabular-nums;"></span>
          </button>
        
          
          <button type="button" role="menuitem" style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 9px; background: transparent; color: oklch(0.2 0.01 110); font: inherit; font-size: 14px; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 1px;">
              <span>Settings…</span>
              
            </span>
            <span style="font-size: 13px; color: oklch(0.45 0.01 110); font-variant-numeric: tabular-nums;">⌘,</span>
          </button>
        
          
          <button type="button" role="menuitem" style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 9px; background: transparent; color: oklch(0.2 0.01 110); font: inherit; font-size: 14px; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 1px;">
              <span>Export Report…</span>
              
            </span>
            <span style="font-size: 13px; color: oklch(0.45 0.01 110); font-variant-numeric: tabular-nums;">⌘E</span>
          </button>
        
          <span role="separator" style="height: 1px; margin: 4px 10px; background: oklch(0.2 0.01 110 / 0.08);"></span>
          <button type="button" role="menuitem" style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 9px; background: transparent; color: oklch(0.2 0.01 110); font: inherit; font-size: 14px; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 1px;">
              <span>Quit Patchbridge</span>
              <span style="font-size: 12px; color: oklch(0.45 0.01 110);">Releases the QC and disconnects the iPhone</span>
            </span>
            <span style="font-size: 13px; color: oklch(0.45 0.01 110); font-variant-numeric: tabular-nums;">⌘Q</span>
          </button>
        
      </div>
    </div>
  

  

  
</div>


</body>
</html>
