<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=340">
<title>Menu bar · bridge stopped</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<style>html,body{margin:0;width:340px;height:460px;overflow:hidden;background:transparent}</style>
</head>
<body>




<div style="width: 340px; height: 460px; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 15px; background: oklch(0.22 0.01 110 / 0.92); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.1); color: oklch(0.96 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7)">

  

  
    <div style="box-sizing: border-box; padding: 14px 8px 8px; display: flex; flex-direction: column; gap: 10px;">
      <div style="padding: 0 8px; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 15px; font-weight: 700;">Patchbridge</span>
        <span role="status" style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: oklch(0.86 0.13 75);">
          
          
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
          Needs attention
        </span>
      </div>

      

      
        <div style="margin: 0 2px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-radius: 12px; background: oklch(0.2 0.009 110); box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.06), 0 0 0 1.5px oklch(0.86 0.13 75);">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.86 0.13 75)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
            The bridge stopped
          </span>
          <span style="font-size: 13px; line-height: 1.4; color: oklch(0.76 0.01 110); text-wrap: pretty;">Jamie’s iPhone was disconnected. Restarting reloads the QC, and the iPhone will need approval again.</span>
          
            <button type="button" style="height: 32px; padding: 0 16px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.4); flex: 1">Restart bridge</button>
          
          
        </div>
      

      <div style="margin: 0 2px; border-radius: 12px; background: oklch(0.2 0.009 110); box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.06);">
        <div style="min-height: 56px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; gap: 12px;">
          <span style="width: 36px; height: 36px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: oklch(1 0 0 / 0.1); border: 0; color: oklch(0.96 0.005 110)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="6" width="3.6" height="3.6" rx="1"></rect><rect x="7.8" y="6" width="3.6" height="3.6" rx="1"></rect><rect x="12.6" y="6" width="3.6" height="3.6" rx="1"></rect><rect x="17.4" y="6" width="3.6" height="3.6" rx="1"></rect><rect x="3" y="11.4" width="3.6" height="3.6" rx="1" opacity="0.45"></rect><rect x="7.8" y="11.4" width="3.6" height="3.6" rx="1"></rect><rect x="12.6" y="11.4" width="3.6" height="3.6" rx="1" opacity="0.45"></rect><rect x="17.4" y="11.4" width="3.6" height="3.6" rx="1"></rect></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 600;">Crunch Lead</span>
            <span style="font-size: 12px; color: oklch(0.76 0.01 110);">My Presets 16 · CorOS 4.1.1</span>
          </span>
          
        </div>
        <div style="min-height: 56px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; gap: 12px; border-top: 1px solid oklch(1 0 0 / 0.08);">
          <span style="width: 36px; height: 36px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: transparent; border: 1.5px dashed oklch(1 0 0 / 0.28); color: oklch(0.76 0.01 110)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 600;">No iPhone connected</span>
            <span style="font-size: 12px; color: oklch(0.76 0.01 110);">Bridge stopped</span>
          </span>
          
        </div>
      </div>

      <div role="menu" aria-label="Patchbridge" style="display: flex; flex-direction: column;">
        
          
          <button type="button" role="menuitem" style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 9px; background: transparent; color: oklch(0.96 0.005 110); font: inherit; font-size: 14px; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 1px;">
              <span>Open Patchbridge</span>
              
            </span>
            <span style="font-size: 13px; color: oklch(0.76 0.01 110); font-variant-numeric: tabular-nums;"></span>
          </button>
        
          
          <button type="button" role="menuitem" style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 9px; background: transparent; color: oklch(0.96 0.005 110); font: inherit; font-size: 14px; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 1px;">
              <span>Settings…</span>
              
            </span>
            <span style="font-size: 13px; color: oklch(0.76 0.01 110); font-variant-numeric: tabular-nums;">⌘,</span>
          </button>
        
          
          <button type="button" role="menuitem" style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 9px; background: transparent; color: oklch(0.96 0.005 110); font: inherit; font-size: 14px; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 1px;">
              <span>Export Report…</span>
              
            </span>
            <span style="font-size: 13px; color: oklch(0.76 0.01 110); font-variant-numeric: tabular-nums;">⌘E</span>
          </button>
        
          <span role="separator" style="height: 1px; margin: 4px 10px; background: oklch(1 0 0 / 0.08);"></span>
          <button type="button" role="menuitem" style="width: 100%; min-height: 32px; box-sizing: border-box; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 9px; background: transparent; color: oklch(0.96 0.005 110); font: inherit; font-size: 14px; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 1px;">
              <span>Quit Patchbridge</span>
              <span style="font-size: 12px; color: oklch(0.76 0.01 110);">Releases the QC and disconnects the iPhone</span>
            </span>
            <span style="font-size: 13px; color: oklch(0.76 0.01 110); font-variant-numeric: tabular-nums;">⌘Q</span>
          </button>
        
      </div>
    </div>
  

  

  
</div>


</body>
</html>
