<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duo · Fold prototype</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}@media (prefers-reduced-motion: reduce){*{transition-duration:1ms !important;transition-delay:0ms !important}}</style>
</helmet>
<div style="width: 860px; height: 1000px; box-sizing: border-box; padding: 28px 32px 0; display: flex; flex-direction: column; align-items: center; gap: 28px; background: radial-gradient(90% 60% at 50% 70%, oklch(0.2 0.01 110), oklch(0.11 0.006 110) 70%); color: oklch(0.96 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;">
  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;">
    <div role="group" aria-label="Posture" style="display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.06);">
      <sc-for list="{{postures}}" as="o" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
      </sc-for>
    </div>
    <div role="group" aria-label="Deck" style="display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.06);">
      <sc-for list="{{screens}}" as="o" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="width: 626px; height: 890px; flex: none;">
    <dc-import name="Inner" posture="{{posture}}" state="{{screen}}" fold3d="{{true}}" hint-size="626px,890px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["flat","half"],"default":"flat","section":"Screen"},"$preview":{"width":860,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const posture = this.state.posture ?? this.props.start ?? 'flat';
    const screen = this.state.screen ?? 'edit';
    const seg = (on) => ({ height: '40px', padding: '0 18px', border: '0', borderRadius: '999px', background: on ? 'oklch(0.87 0.17 115)' : 'transparent', color: on ? 'oklch(0.2 0.04 115)' : 'inherit', font: 'inherit', fontSize: '15px', fontWeight: 600, cursor: 'pointer', transition: 'background 200ms cubic-bezier(0.22, 1, 0.36, 1), color 200ms cubic-bezier(0.22, 1, 0.36, 1)' });
    const opts = (list, cur, key) => list.map(([id, label]) => ({ label, pressed: id === cur ? 'true' : 'false', style: seg(id === cur), pick: () => this.setState({ [key]: id }) }));
    return {
      posture, screen,
      postures: opts([['flat', 'Unfolded'], ['half', 'Half-folded']], posture, 'posture'),
      screens: opts([['row', 'Row'], ['edit', 'Block'], ['type', 'Typing']], screen, 'screen')
    };
  }
}
</script>
</body>
</html>
