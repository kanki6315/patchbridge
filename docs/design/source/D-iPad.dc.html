<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Combined: iPad and unfolded split view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.87 0.17 115)}a:hover{color:oklch(0.93 0.12 115)}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; box-sizing: border-box; padding: 28px 24px 20px; display: flex; flex-direction: column; gap: 16px; background: radial-gradient(40% 60% at 84% 52%, oklch(0.3 0.07 27 / 0.6), transparent 70%), oklch(0.16 0.008 110); color: oklch(0.96 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <header style="display: flex; align-items: center; gap: 14px;">
    <button type="button" style="height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 2px; border: 0; border-radius: 22px; background: oklch(0.26 0.01 110 / 0.6); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); font-size: 15px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Presets
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.015em;">Clean Edge Lead</h1>
      <span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: oklch(0.78 0.01 110);">
        Bank 3 · Slot B
        <span style="display: inline-flex; align-items: center; gap: 6px; color: oklch(0.87 0.17 115); font-weight: 600;"><span style="width: 7px; height: 7px; border-radius: 50%; background: currentColor;"></span>2 changes not saved</span>
      </span>
    </div>
    <span style="flex: 1;"></span>
    <button type="button" aria-label="Bridge: Studio Mac, QC connected, CorOS 4.1.1" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 7px; border: 0; border-radius: 22px; background: oklch(0.26 0.01 110 / 0.6); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); font-size: 14px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.87 0.17 115)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      Studio Mac · CorOS 4.1.1
    </button>
    <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: oklch(1 0 0 / 0.1); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); font-size: 15px;">Save As…</button>
    <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5);">Save to 3B</button>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; gap: 20px;">
    <div style="width: 712px; flex: none; display: flex; flex-direction: column; gap: 14px;">
      <div role="group" aria-label="Scenes" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{scenes}}" as="sc" hint-placeholder-count="8">
          <button type="button" aria-pressed="{{sc.pressed}}" style="{{sc.style}}">
            <span style="font-size: 16px; font-weight: 700;">{{sc.letter}}</span>
            <span style="font-size: 11px;">{{sc.name}}</span>
          </button>
        </sc-for>
      </div>

      <section aria-label="Signal chain, 4 rows by 8 slots" style="padding: 10px 10px 10px 4px; display: flex; flex-direction: column; gap: 6px; border-radius: 24px; background: oklch(0.2 0.009 110); box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.06);">
        <sc-for list="{{grid}}" as="row" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 4px;">
            <span style="width: 22px; text-align: center; font-size: 13px; font-weight: 600; color: oklch(0.72 0.01 110);">{{row.n}}</span>
            <div style="{{row.bandStyle}}">
              <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="8">
                <button type="button" aria-label="{{c.aria}}" style="{{c.style}}">
                  <span style="{{c.codeStyle}}">{{c.code}}</span>
                  <span style="{{c.nameStyle}}">{{c.name}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </section>

      <section aria-label="Row 1 blocks" style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px;">
          <span style="font-size: 16px; font-weight: 600;">Row 1</span>
          <span style="font-size: 13px; color: oklch(0.74 0.01 110);">4 blocks · slots 5–8 empty</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px;">
          <sc-for list="{{lane}}" as="b" hint-placeholder-count="4">
            <div style="height: 58px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid oklch(1 0 0 / 0.06);">
              <span aria-hidden="true" style="{{b.swatchStyle}}">{{b.code}}</span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                <span style="{{b.nameStyle}}">{{b.name}}</span>
                <span style="font-size: 13px; color: oklch(0.76 0.01 110); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{b.summary}}</span>
              </div>
              <button type="button" role="switch" aria-checked="{{b.on}}" aria-label="{{b.switchLabel}}" style="{{b.switchStyle}}">
                <span style="width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px oklch(0 0 0 / 0.3);"></span>
              </button>
            </div>
          </sc-for>
        </div>
      </section>
    </div>

    <aside aria-label="Crunch 50 editor" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; border-radius: 28px; background: oklch(0.22 0.025 27 / 0.55); backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06), 0 20px 50px oklch(0 0 0 / 0.35);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: oklch(0.56 0.2 27); color: #fff; font-size: 11px; font-weight: 700; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.4);">AMP</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 20px; font-weight: 700;">Crunch 50</span>
          <span style="font-size: 13px; color: oklch(0.82 0.02 27);">Row 1, slot 3 · Scene A</span>
        </div>
        <button type="button" role="switch" aria-checked="true" aria-label="Block active" style="width: 51px; height: 31px; padding: 2px; border: 0; border-radius: 16px; background: oklch(0.87 0.17 115); display: flex; justify-content: flex-end;">
          <span style="width: 27px; height: 27px; border-radius: 50%; background: #fff;"></span>
        </button>
      </div>

      <div style="position: relative; margin-top: 14px; display: flex; flex-direction: column; align-items: center;">
        <span style="font-size: 17px; font-weight: 600;">Gain</span>
        <div style="position: relative; width: 220px; height: 204px;">
          <svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Gain 6.4 of 10, sending, QC at 6.2" style="position: absolute; top: 0; left: 0;">
            <path d="{{trackD}}" fill="none" stroke="oklch(1 0 0 / 0.13)" stroke-width="15" stroke-linecap="round"></path>
            <path d="{{solidD}}" fill="none" stroke="oklch(0.74 0.16 27)" stroke-width="15" stroke-linecap="round"></path>
            <path d="{{provD}}" fill="none" stroke="oklch(0.74 0.16 27)" stroke-width="15" stroke-dasharray="3 6"></path>
            <line x1="{{tick.x1}}" y1="{{tick.y1}}" x2="{{tick.x2}}" y2="{{tick.y2}}" stroke="oklch(0.97 0.006 27)" stroke-width="3" stroke-linecap="round"></line>
            <circle cx="{{thumb.x}}" cy="{{thumb.y}}" r="12" fill="#ffffff" stroke="oklch(0.2 0.02 27)" stroke-width="3"></circle>
          </svg>
          <button type="button" aria-label="Gain 6.4. Tap to type a value" style="position: absolute; left: 50%; top: 66px; transform: translateX(-50%); height: 70px; padding: 0 12px; border: 0; border-radius: 18px; background: transparent; outline: 1.5px dashed oklch(0.87 0.17 115); outline-offset: -1.5px; font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -0.02em;">6.4</button>
          <span style="position: absolute; left: 0; right: 0; top: 140px; text-align: center; font-size: 12px; color: oklch(0.82 0.02 27);">Tap number to type</span>
        </div>
        <button type="button" aria-label="Decrease gain by 0.1" style="position: absolute; left: 6px; top: 176px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(1 0 0 / 0.1); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(1 0 0 / 0.06);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <button type="button" aria-label="Increase gain by 0.1" style="position: absolute; right: 6px; top: 176px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(1 0 0 / 0.1); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(1 0 0 / 0.06);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
        </button>
        <div style="margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: oklch(0.87 0.17 115);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 3" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>
          Sending 6.4. QC is still at 6.2
        </div>
      </div>

      <div role="group" aria-label="Parameters" style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
          <button type="button" aria-pressed="{{t.pressed}}" aria-label="{{t.aria}}" style="{{t.style}}">
            <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">{{t.name}}<span style="{{t.tagStyle}}">{{t.tag}}</span></span>
            <span style="{{t.valueStyle}}">{{t.value}}</span>
          </button>
        </sc-for>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const cat = {
      CMP: { bg: 'oklch(0.68 0.12 160)', ink: 'oklch(0.17 0.02 160)', kind: 'Compressor' },
      DRV: { bg: 'oklch(0.76 0.16 65)', ink: 'oklch(0.2 0.04 65)', kind: 'Drive' },
      AMP: { bg: 'oklch(0.56 0.2 27)', ink: '#ffffff', kind: 'Amp' },
      CAB: { bg: 'oklch(0.52 0.05 50)', ink: '#ffffff', kind: 'Cab' },
      MOD: { bg: 'oklch(0.58 0.18 330)', ink: '#ffffff', kind: 'Modulation' },
      DLY: { bg: 'oklch(0.7 0.14 245)', ink: 'oklch(0.18 0.04 245)', kind: 'Delay' },
      REV: { bg: 'oklch(0.82 0.09 210)', ink: 'oklch(0.2 0.03 210)', kind: 'Reverb' }
    };
    const names = { CMP: 'Compressor', DRV: 'Overdrive', AMP: 'Crunch 50', CAB: '4×12 Cab', MOD: 'Chorus', DLY: 'Tape Echo', REV: 'Plate' };
    const layout = [
      ['CMP', 'DRV-', 'AMP*', 'CAB', '', '', '', ''],
      ['MOD', 'DLY', 'REV', '', '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      ['', '', '', '', '', '', '', '']
    ];
    const cellBase = { width: '78px', height: '86px', padding: '10px 9px', boxSizing: 'border-box', borderRadius: '16px', border: '0', display: 'flex', flexDirection: 'column', alignItems: 'flex-start', justifyContent: 'space-between', textAlign: 'left' };
    const nameBase = { maxWidth: '100%', fontSize: '12px', fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' };
    const hidden = { display: 'none' };
    const grid = layout.map((row, ri) => ({
      n: String(ri + 1),
      bandStyle: { display: 'flex', gap: '6px', padding: '3px', borderRadius: '19px', background: ri === 0 ? 'oklch(1 0 0 / 0.08)' : 'transparent' },
      cells: row.map((raw, si) => {
        const slot = 'Row ' + (ri + 1) + ', slot ' + (si + 1);
        if (!raw) return { code: '', name: '', aria: slot + ', empty', codeStyle: hidden, nameStyle: hidden, style: { ...cellBase, background: 'transparent', border: '1px solid oklch(0.3 0.01 110)' } };
        const code = raw.replace(/[*-]/g, '');
        const c = cat[code];
        if (raw.endsWith('-')) return { code, name: 'Bypassed', aria: slot + ', ' + names[code] + ', bypassed',
          codeStyle: { fontSize: '11px', fontWeight: 700, color: 'oklch(0.78 0.01 110)', textDecoration: 'line-through' },
          nameStyle: { ...nameBase, color: 'oklch(0.78 0.01 110)' },
          style: { ...cellBase, background: 'transparent', border: '1.5px dashed ' + c.bg } };
        const sel = raw.endsWith('*');
        return { code, name: names[code], aria: slot + ', ' + c.kind + ', ' + names[code] + (sel ? ', selected' : ''),
          codeStyle: { fontSize: '11px', fontWeight: 700, color: c.ink, opacity: 0.85 },
          nameStyle: { ...nameBase, color: c.ink, fontWeight: 600 },
          style: { ...cellBase, background: c.bg, boxShadow: 'inset 0 1px 0 oklch(1 0 0 / 0.35), inset 0 -12px 20px oklch(0 0 0 / 0.1)', outline: sel ? '2.5px solid oklch(0.87 0.17 115)' : 'none', outlineOffset: '3px' } };
      })
    }));
    const scBase = { height: '52px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '1px', border: '0', borderRadius: '16px' };
    const scenes = [['A', 'Rhythm'], ['B', 'Lead'], ['C', 'Clean'], ['D', 'Swell'], ['E', 'Solo'], ['F', 'Ambient'], ['G', 'Dry'], ['H', 'Octave']].map(([letter, name], i) => ({
      letter, name, pressed: i === 0 ? 'true' : 'false',
      style: i === 0 ? { ...scBase, background: 'oklch(0.87 0.17 115)', color: 'oklch(0.2 0.04 115)', boxShadow: 'inset 0 1px 0 oklch(1 0 0 / 0.5)' }
        : { ...scBase, background: 'oklch(1 0 0 / 0.07)', boxShadow: 'inset 0 1px 0 oklch(1 0 0 / 0.1)' }
    }));
    const sw = { width: '40px', height: '40px', flex: 'none', boxSizing: 'border-box', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '12px', fontSize: '11px', fontWeight: 700 };
    const sws = { width: '51px', height: '31px', flex: 'none', padding: '2px', border: '0', borderRadius: '16px', display: 'flex' };
    const block = (code, summary, on = true) => {
      const c = cat[code];
      return { code, name: names[code], on: on ? 'true' : 'false', summary: on ? summary : 'Bypassed',
        switchLabel: names[code] + (on ? ' active' : ' bypassed'),
        swatchStyle: on ? { ...sw, background: c.bg, color: c.ink } : { ...sw, border: '2px dashed ' + c.bg, color: 'oklch(0.78 0.01 110)', textDecoration: 'line-through' },
        nameStyle: { fontSize: '15px', fontWeight: 600, color: on ? 'oklch(0.96 0.005 110)' : 'oklch(0.72 0.01 110)' },
        switchStyle: on ? { ...sws, justifyContent: 'flex-end', background: 'oklch(0.87 0.17 115)' } : { ...sws, justifyContent: 'flex-start', background: 'oklch(1 0 0 / 0.18)' } };
    };
    const cx = 110, cy = 110, r = 88;
    const ang = (v) => (135 + (v / 10) * 270) * Math.PI / 180;
    const pt = (v, rad = r) => ({ x: +(cx + rad * Math.cos(ang(v))).toFixed(2), y: +(cy + rad * Math.sin(ang(v))).toFixed(2) });
    const arc = (a, b) => { const p0 = pt(a), p1 = pt(b); const large = (b - a) / 10 * 270 > 180 ? 1 : 0; return 'M ' + p0.x + ' ' + p0.y + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1.x + ' ' + p1.y; };
    const ti = pt(6.2, 74), to = pt(6.2, 102);
    const tile = { height: '60px', boxSizing: 'border-box', padding: '0 12px', display: 'flex', flexDirection: 'column', alignItems: 'flex-start', justifyContent: 'center', gap: '2px', borderRadius: '16px', border: '1.5px solid transparent', background: 'oklch(1 0 0 / 0.08)', boxShadow: 'inset 0 1px 0 oklch(1 0 0 / 0.12)' };
    const mk = (name, value, opts = {}) => ({ name, value, pressed: opts.active ? 'true' : 'false', tag: opts.tag || '', aria: name + ', ' + value,
      tagStyle: opts.tag ? { fontSize: '10px', fontWeight: 600, padding: '1px 5px', borderRadius: '5px', background: 'oklch(1 0 0 / 0.14)' } : hidden,
      valueStyle: { fontSize: opts.small ? '15px' : '19px', fontWeight: 600, color: opts.muted ? 'oklch(0.82 0.02 27)' : 'inherit' },
      style: opts.active ? { ...tile, background: 'oklch(0.74 0.16 27 / 0.22)', border: '1.5px solid oklch(0.74 0.16 27)' } : tile });
    return {
      grid, scenes,
      lane: [block('CMP', 'Threshold −18 dB · Ratio 4:1'), block('DRV', '', false), block('AMP', 'Gain 6.2 · Mid 6.5 · Master 7.0'), block('CAB', 'Dynamic mic · 2.0 in')],
      trackD: arc(0, 10), solidD: arc(0, 6.2), provD: arc(6.2, 6.4),
      tick: { x1: ti.x, y1: ti.y, x2: to.x, y2: to.y }, thumb: pt(6.4),
      tiles: [mk('Gain', '6.4', { active: true }), mk('Bass', '5.0'), mk('Mid', '6.5', { tag: 'QC' }), mk('Treble', '5.8'), mk('Presence', '4.0'), mk('Master', '7.0'), mk('Channel', 'Crunch', { small: true }), mk('Bright', 'Off', { small: true, muted: true }), mk('Level', '−3.0 dB', { small: true })]
    };
  }
}
</script>
</body>
</html>
