<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Combined: preset overview, portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.87 0.17 115)}a:hover{color:oklch(0.93 0.12 115)}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 16px 0; display: flex; flex-direction: column; gap: 14px; background: oklch(0.16 0.008 110); color: oklch(0.96 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <header style="display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <button type="button" style="height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 2px; border: 0; border-radius: 22px; background: oklch(0.26 0.01 110 / 0.6); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); font-size: 15px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        Presets
      </button>
      <button type="button" aria-label="Bridge: Studio Mac, QC connected" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 7px; border: 0; border-radius: 22px; background: oklch(0.26 0.01 110 / 0.6); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); font-size: 14px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.87 0.17 115)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
        Studio Mac
      </button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em;">Clean Edge Lead</h1>
      <span style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: oklch(0.78 0.01 110);">
        Bank 3 · Slot B
        <span style="display: inline-flex; align-items: center; gap: 6px; color: oklch(0.87 0.17 115); font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 50%; background: currentColor;"></span>Edited, not saved</span>
      </span>
    </div>
    <div role="group" aria-label="Scenes" style="display: flex; gap: 8px;">
      <button type="button" aria-pressed="true" style="flex: 1; height: 44px; border: 0; border-radius: 15px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5);">A Rhythm</button>
      <button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 15px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.1); font-size: 15px;">B Lead</button>
      <button type="button" aria-pressed="false" style="flex: 1; height: 44px; border: 0; border-radius: 15px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.1); font-size: 15px;">C Clean</button>
      <button type="button" aria-label="More scenes" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 15px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
    </div>
  </header>

  <section aria-label="Signal chain, 4 rows by 8 slots" style="padding: 8px; display: flex; flex-direction: column; gap: 2px; border-radius: 20px; background: oklch(0.2 0.009 110); box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.06);">
    <sc-for list="{{grid}}" as="row" hint-placeholder-count="4">
      <div style="{{row.bandStyle}}">
        <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="8">
          <button type="button" aria-label="{{c.aria}}" style="{{c.style}}">{{c.code}}</button>
        </sc-for>
      </div>
    </sc-for>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 2px; font-size: 12px; color: oklch(0.74 0.01 110);">
      <span>Tap a row to list its blocks</span>
      <span style="display: flex; align-items: center; gap: 5px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" transform="rotate(-90 12 12)"></rect><path d="M4 8a8 8 0 0 1 4-4"></path></svg>
        Rotate for full size
      </span>
    </div>
  </section>

  <section aria-label="Row 1 blocks" style="display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 4px;">
      <span style="font-size: 17px; font-weight: 600;">Row 1</span>
      <span style="font-size: 13px; color: oklch(0.74 0.01 110);">4 blocks · slots 5–8 empty</span>
    </div>
    <div style="position: relative;">
      <div aria-hidden="true" style="position: absolute; left: 20px; top: 30px; bottom: 30px; width: 2px; background: oklch(0.32 0.01 110);"></div>
      <ol style="list-style: none; margin: 0; padding: 0;">
        <sc-for list="{{lane}}" as="b" hint-placeholder-count="4">
          <li style="position: relative; height: 60px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid oklch(1 0 0 / 0.06);">
            <span aria-hidden="true" style="{{b.swatchStyle}}">{{b.code}}</span>
            <a href="D-Editor.dc.html" style="flex: 1; min-width: 0; min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 2px; color: inherit; text-decoration: none;">
              <span style="{{b.nameStyle}}">{{b.name}}</span>
              <span style="font-size: 13px; color: oklch(0.76 0.01 110); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{b.summary}}</span>
            </a>
            <button type="button" role="switch" aria-checked="{{b.on}}" aria-label="{{b.switchLabel}}" style="{{b.switchStyle}}">
              <span style="width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px oklch(0 0 0 / 0.3);"></span>
            </button>
          </li>
        </sc-for>
      </ol>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 34px; display: flex; gap: 10px; background: oklch(0.2 0.009 110 / 0.62); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-top: 1px solid oklch(1 0 0 / 0.08);">
    <button type="button" style="flex: 1; height: 54px; border: 0; border-radius: 20px; background: oklch(1 0 0 / 0.1); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12); font-size: 16px;">Save As…</button>
    <button type="button" style="flex: 1.5; height: 54px; border: 0; border-radius: 20px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5); font-size: 16px; font-weight: 600;">Save to 3B</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cat = {
      CMP: { bg: 'oklch(0.68 0.12 160)', ink: 'oklch(0.17 0.02 160)', kind: 'Compressor' },
      DRV: { bg: 'oklch(0.76 0.16 65)', ink: 'oklch(0.2 0.04 65)', kind: 'Drive' },
      AMP: { bg: 'oklch(0.56 0.2 27)', ink: '#ffffff', kind: 'Amp' },
      CAB: { bg: 'oklch(0.52 0.05 50)', ink: '#ffffff', kind: 'Cab' },
      MOD: { bg: 'oklch(0.58 0.18 330)', ink: '#ffffff', kind: 'Modulation' },
      DLY: { bg: 'oklch(0.7 0.14 245)', ink: 'oklch(0.18 0.04 245)', kind: 'Delay' },
      REV: { bg: 'oklch(0.82 0.09 210)', ink: 'oklch(0.2 0.03 210)', kind: 'Reverb' }
    };
    const layout = [
      ['CMP', 'DRV-', 'AMP', 'CAB', '', '', '', ''],
      ['MOD', 'DLY', 'REV', '', '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      ['', '', '', '', '', '', '', '']
    ];
    const cellBase = { height: '38px', padding: '0', boxSizing: 'border-box', borderRadius: '9px', border: '0', fontSize: '10px', fontWeight: 700 };
    const grid = layout.map((row, ri) => ({
      bandStyle: { display: 'grid', gridTemplateColumns: 'repeat(8, minmax(0, 1fr))', gap: '4px', padding: '4px', borderRadius: '13px', background: ri === 0 ? 'oklch(1 0 0 / 0.09)' : 'transparent', boxShadow: ri === 0 ? 'inset 0 0 0 1.5px oklch(0.87 0.17 115 / 0.7)' : 'none' },
      cells: row.map((raw, si) => {
        const slot = 'Row ' + (ri + 1) + ', slot ' + (si + 1);
        if (!raw) return { code: '', aria: slot + ', empty', style: { ...cellBase, background: 'transparent', border: '1px solid oklch(0.3 0.01 110)' } };
        const code = raw.replace('-', '');
        const c = cat[code];
        if (raw.endsWith('-')) return { code, aria: slot + ', ' + c.kind + ', bypassed', style: { ...cellBase, background: 'transparent', border: '1.5px dashed ' + c.bg, color: 'oklch(0.78 0.01 110)', textDecoration: 'line-through' } };
        return { code, aria: slot + ', ' + c.kind, style: { ...cellBase, background: c.bg, color: c.ink, boxShadow: 'inset 0 1px 0 oklch(1 0 0 / 0.35)' } };
      })
    }));
    const sw = { position: 'relative', zIndex: 1, width: '42px', height: '42px', flex: 'none', boxSizing: 'border-box', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '12px', fontSize: '11px', fontWeight: 700 };
    const sws = { width: '51px', height: '31px', flex: 'none', padding: '2px', border: '0', borderRadius: '16px', display: 'flex' };
    const block = (code, name, summary, on = true) => {
      const c = cat[code];
      return { code, name, on: on ? 'true' : 'false',
        summary: on ? summary : 'Bypassed',
        switchLabel: name + (on ? ' active' : ' bypassed'),
        swatchStyle: on ? { ...sw, background: c.bg, color: c.ink, boxShadow: 'inset 0 1px 0 oklch(1 0 0 / 0.4)' }
          : { ...sw, background: 'oklch(0.16 0.008 110)', border: '2px dashed ' + c.bg, color: 'oklch(0.78 0.01 110)', textDecoration: 'line-through' },
        nameStyle: { fontSize: '16px', fontWeight: 600, color: on ? 'oklch(0.96 0.005 110)' : 'oklch(0.72 0.01 110)' },
        switchStyle: on ? { ...sws, justifyContent: 'flex-end', background: 'oklch(0.87 0.17 115)' } : { ...sws, justifyContent: 'flex-start', background: 'oklch(1 0 0 / 0.18)' } };
    };
    return {
      grid,
      lane: [
        block('CMP', 'Compressor', 'Threshold −18 dB · Ratio 4:1'),
        block('DRV', 'Overdrive', '', false),
        block('AMP', 'Crunch 50', 'Gain 6.2 · Mid 6.5 · Master 7.0'),
        block('CAB', '4×12 Cab', 'Dynamic mic · 2.0 in')
      ]
    };
  }
}
</script>
</body>
</html>
