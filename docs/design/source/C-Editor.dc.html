<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Console: block editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.87 0.17 115)}a:hover{color:oklch(0.93 0.12 115)}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 16px 0; display: flex; flex-direction: column; gap: 10px; background: oklch(0.19 0.006 110); color: oklch(0.95 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="C-Overview.dc.html" style="height: 44px; padding: 0 10px 0 2px; display: flex; align-items: center; gap: 2px; color: oklch(0.87 0.17 115); text-decoration: none; font-size: 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Overview
    </a>
    <span style="font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.76 0.008 110);">Amp · R1 S3 · Scene A</span>
  </div>
  <h1 style="margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -0.015em;">Crunch 50</h1>

  <div style="border: 1px solid oklch(0.31 0.008 110); border-radius: 18px; background: oklch(0.215 0.007 110); overflow: hidden;">

    <div style="padding: 10px 12px 12px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid oklch(0.27 0.008 110); background: oklch(0.235 0.008 110);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 600;">Gain</span>
          <span style="font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.74 0.008 110);">0.0–10.0 · step 0.1</span>
        </div>
        <button type="button" aria-label="Decrease gain" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: oklch(0.3 0.008 110); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <button type="button" aria-label="{{gainAria}}" style="{{fieldStyle}}">{{gainValue}}</button>
        <button type="button" aria-label="Increase gain" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: oklch(0.3 0.008 110); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
      </div>
      <div aria-hidden="true" style="position: relative; height: 22px;">
        <div style="position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: oklch(0.32 0.008 110);"></div>
        <div style="position: absolute; left: 0; top: 9px; height: 4px; border-radius: 2px; width: 62%; background: oklch(0.68 0.19 27);"></div>
        <div style="{{provStyle}}"></div>
        <div style="{{knobStyle}}"></div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 12px;">
        <span style="{{ledgerStyle}}">{{ledger}}</span>
        <sc-if value="{{isRejected}}" hint-placeholder-val="{{false}}">
          <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid oklch(0.82 0.14 70); border-radius: 9px; background: transparent; color: oklch(0.86 0.12 70); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600;">Send again</button>
        </sc-if>
      </div>
    </div>

    <sc-for list="{{steppers}}" as="s" hint-placeholder-count="3">
      <div style="height: 60px; box-sizing: border-box; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid oklch(0.27 0.008 110);">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 15px;">{{s.name}}<span style="{{s.tagStyle}}">{{s.tag}}</span></span>
          <span style="font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.74 0.008 110);">{{s.range}}</span>
        </div>
        <button type="button" aria-label="{{s.dec}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: oklch(0.27 0.008 110); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <button type="button" aria-label="{{s.aria}}" style="width: 72px; height: 44px; box-sizing: border-box; border: 1px solid oklch(0.33 0.008 110); border-radius: 12px; background: oklch(0.19 0.006 110); font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500;">{{s.value}}</button>
        <button type="button" aria-label="{{s.inc}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: oklch(0.27 0.008 110); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
      </div>
    </sc-for>

    <div style="height: 60px; box-sizing: border-box; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid oklch(0.27 0.008 110);">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px;">Channel</span>
        <span style="font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.74 0.008 110);">3 options</span>
      </div>
      <button type="button" aria-haspopup="listbox" style="height: 44px; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 6px; border: 1px solid oklch(0.33 0.008 110); border-radius: 12px; background: oklch(0.19 0.006 110); font-size: 15px;">
        Crunch
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
      </button>
    </div>

    <div style="height: 60px; box-sizing: border-box; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid oklch(0.27 0.008 110);">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px;">Bright</span>
        <span style="font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.74 0.008 110);">on / off</span>
      </div>
      <button type="button" role="switch" aria-checked="false" aria-label="Bright" style="width: 51px; height: 31px; padding: 2px; border: 0; border-radius: 16px; background: oklch(0.33 0.008 110); display: flex; justify-content: flex-start;">
        <span style="width: 27px; height: 27px; border-radius: 50%; background: #fff;"></span>
      </button>
    </div>

    <div style="height: 60px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 8px;">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: oklch(0.8 0.006 110);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          Presence
        </span>
        <span style="font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.74 0.008 110);">Expression-controlled · read-only</span>
      </div>
      <span style="font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace; font-size: 16px; color: oklch(0.8 0.006 110);">4.0</span>
    </div>
  </div>

  <nav aria-label="Step size and save" style="position: absolute; left: 12px; right: 12px; bottom: 26px; box-sizing: border-box; height: 64px; padding: 6px; display: flex; align-items: center; gap: 6px; border-radius: 32px; background: oklch(0.26 0.008 110 / 0.62); backdrop-filter: blur(22px) saturate(1.8); -webkit-backdrop-filter: blur(22px) saturate(1.8); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(1 0 0 / 0.07), 0 10px 30px oklch(0 0 0 / 0.45);">
    <div role="group" aria-label="Step size" style="display: flex; gap: 2px;">
      <button type="button" aria-pressed="false" style="width: 76px; height: 52px; border: 0; border-radius: 26px; background: transparent; font-size: 15px;">Coarse</button>
      <button type="button" aria-pressed="true" style="width: 64px; height: 52px; border: 0; border-radius: 26px; background: oklch(0.95 0.005 110); color: oklch(0.19 0.006 110); font-size: 15px; font-weight: 600;">Fine</button>
    </div>
    <button type="button" style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); font-size: 16px; font-weight: 600;">Save · 2 changes</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"editState":{"editor":"enum","options":["pending","confirmed","rejected"],"default":"pending","section":"Edit state"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.editState ?? 'pending';
    const mono = "ui-monospace, 'SF Mono', 'JetBrains Mono', monospace";
    const field = { width: '72px', height: '44px', boxSizing: 'border-box', borderRadius: '12px', background: 'oklch(0.19 0.006 110)', fontFamily: mono, fontSize: '16px', fontWeight: 600 };
    const shown = s === 'pending' || s === 'confirmed' ? 6.4 : 6.2;
    const knob = { position: 'absolute', top: '1px', width: '20px', height: '20px', boxSizing: 'border-box', borderRadius: '50%', left: 'calc(' + (shown * 10) + '% - 10px)', background: '#fff', boxShadow: '0 1px 4px oklch(0 0 0 / 0.5)' };
    const stepper = (name, v, lo, hi, unit, tag) => {
      const txt = unit ? (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) : v.toFixed(1);
      return { name, value: txt, range: lo + '–' + hi + (unit ? ' ' + unit : '') + ' · step 0.1',
        aria: name + ' ' + txt + (unit ? ' ' + unit : '') + ', tap to type', dec: 'Decrease ' + name.toLowerCase(), inc: 'Increase ' + name.toLowerCase(),
        tag: tag || '', tagStyle: tag ? { fontFamily: mono, fontSize: '10px', padding: '1px 5px', borderRadius: '4px', border: '1px solid oklch(0.4 0.008 110)', color: 'oklch(0.82 0.008 110)' } : { display: 'none' } };
    };
    return {
      gainValue: shown.toFixed(1),
      gainAria: 'Gain ' + shown.toFixed(1) + (s === 'pending' ? ', sending' : '') + ', tap to type',
      fieldStyle: s === 'pending' ? { ...field, border: '1.5px dashed oklch(0.87 0.17 115)', color: 'oklch(0.87 0.17 115)' }
        : s === 'rejected' ? { ...field, border: '1.5px solid oklch(0.82 0.14 70)' }
        : { ...field, border: '1.5px solid oklch(0.87 0.17 115)' },
      provStyle: s === 'pending' ? { position: 'absolute', left: '62%', width: '2%', top: '9px', height: '4px', background: 'repeating-linear-gradient(90deg, oklch(0.68 0.19 27) 0 2px, transparent 2px 4px)' } : { display: 'none' },
      knobStyle: s === 'pending' ? { ...knob, border: '2px dashed oklch(0.87 0.17 115)' } : knob,
      ledger: s === 'pending' ? 'sent 6.4 · QC 6.2 · waiting' : s === 'confirmed' ? 'QC 6.4 · confirmed' : 'QC kept 6.2 · scene changed first',
      ledgerStyle: { color: s === 'rejected' ? 'oklch(0.86 0.12 70)' : 'oklch(0.87 0.17 115)' },
      isRejected: s === 'rejected',
      steppers: [
        stepper('Bass', 5.0, '0.0', '10.0'),
        stepper('Mid', 6.5, '0.0', '10.0', '', 'on QC'),
        stepper('Level', -3.0, '−20', '+6', 'dB')
      ]
    };
  }
}
</script>
</body>
</html>
