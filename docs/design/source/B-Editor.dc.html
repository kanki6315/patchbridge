<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Thumb Lane: block editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.97 0.01 27)}a:hover{color:#fff}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 16px 0; display: flex; flex-direction: column; background: oklch(0.25 0.075 27); color: oklch(0.97 0.01 27); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="B-Overview.dc.html" style="height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 2px; border-radius: 22px; background: oklch(1 0 0 / 0.1); color: inherit; text-decoration: none; font-size: 15px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Clean Edge Lead
    </a>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
      Active
      <button type="button" role="switch" aria-checked="true" aria-label="Block active" style="width: 51px; height: 31px; padding: 2px; border: 0; border-radius: 16px; background: oklch(0.97 0.01 27); display: flex; justify-content: flex-end;">
        <span style="width: 27px; height: 27px; border-radius: 50%; background: oklch(0.25 0.075 27);"></span>
      </button>
    </label>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.015em;">Crunch 50</h1>
    <span style="font-size: 14px; color: oklch(0.85 0.03 27);">Amp · Row 1, slot 3 · Scene A</span>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: column; align-items: center;">
    <span style="font-size: 20px; font-weight: 600;">Gain</span>
    <div style="position: relative; width: 240px; height: 222px;">
      <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="{{gaugeLabel}}" style="position: absolute; top: 0; left: 0;">
        <path d="{{trackD}}" fill="none" stroke="oklch(1 0 0 / 0.14)" stroke-width="18" stroke-linecap="round"></path>
        <path d="{{solidD}}" fill="none" stroke="oklch(0.8 0.13 27)" stroke-width="18" stroke-linecap="round"></path>
        <path d="{{provD}}" fill="none" stroke="oklch(0.8 0.13 27)" stroke-width="18" stroke-dasharray="3 6" opacity="{{provOpacity}}"></path>
        <line x1="{{tick.x1}}" y1="{{tick.y1}}" x2="{{tick.x2}}" y2="{{tick.y2}}" stroke="oklch(0.97 0.01 27)" stroke-width="3" stroke-linecap="round" opacity="{{provOpacity}}"></line>
        <circle cx="{{thumb.x}}" cy="{{thumb.y}}" r="14" fill="#ffffff" stroke="oklch(0.25 0.075 27)" stroke-width="3"></circle>
      </svg>
      <div style="position: absolute; left: 0; right: 0; top: 78px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <span style="font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -0.02em;">{{value}}</span>
        <span style="font-size: 13px; color: oklch(0.85 0.03 27);">of 10.0</span>
      </div>
      <span style="position: absolute; left: 28px; bottom: 0; font-size: 12px; color: oklch(0.85 0.03 27);">0</span>
      <span style="position: absolute; right: 22px; bottom: 0; font-size: 12px; color: oklch(0.85 0.03 27);">10</span>
    </div>
    <div style="{{statusStyle}}">
      <sc-if value="{{isPending}}" hint-placeholder-val="{{true}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 3" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>
      </sc-if>
      <sc-if value="{{isConfirmed}}" hint-placeholder-val="{{false}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      </sc-if>
      <sc-if value="{{isRejected}}" hint-placeholder-val="{{false}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4"></path><path d="M12 17.5v.5"></path></svg>
      </sc-if>
      <span>{{status}}</span>
    </div>
  </div>

  <div style="margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 16px;">
    <button type="button" aria-label="Decrease gain by 0.1" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
    </button>
    <button type="button" style="height: 48px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 24px; background: oklch(1 0 0 / 0.12); font-size: 15px; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"></path></svg>
      Type value
    </button>
    <button type="button" aria-label="Increase gain by 0.1" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
    </button>
  </div>

  <div role="group" aria-label="Parameters" style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
      <button type="button" aria-pressed="{{c.pressed}}" style="{{c.style}}">
        <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.88 0.03 27);">{{c.name}}<span style="{{c.tagStyle}}">{{c.tag}}</span></span>
        <span style="font-size: 20px; font-weight: 600;">{{c.value}}</span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: oklch(0.2 0.06 27 / 0.72); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-top: 1px solid oklch(1 0 0 / 0.1);">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: currentColor;"></span>
      2 changes not saved
    </span>
    <button type="button" style="height: 52px; padding: 0 26px; border: 0; border-radius: 26px; background: oklch(0.97 0.01 27); color: oklch(0.25 0.075 27); font-size: 16px; font-weight: 600;">Save to 3B</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"editState":{"editor":"enum","options":["pending","confirmed","rejected"],"default":"pending","section":"Edit state"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.editState ?? 'pending';
    const cx = 120, cy = 120, r = 96;
    const ang = (v) => (135 + (v / 10) * 270) * Math.PI / 180;
    const pt = (v, rad = r) => ({ x: +(cx + rad * Math.cos(ang(v))).toFixed(2), y: +(cy + rad * Math.sin(ang(v))).toFixed(2) });
    const arc = (a, b) => {
      const p0 = pt(a), p1 = pt(b);
      const large = (b - a) / 10 * 270 > 180 ? 1 : 0;
      return 'M ' + p0.x + ' ' + p0.y + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1.x + ' ' + p1.y;
    };
    const confirmed = s === 'confirmed' ? 6.4 : 6.2;
    const shown = s === 'pending' ? 6.4 : confirmed;
    const i = pt(6.2, 80), o = pt(6.2, 112);
    const statusBase = { marginTop: '10px', minHeight: '20px', display: 'flex', alignItems: 'center', gap: '6px', fontSize: '14px', fontWeight: 500 };
    const status = s === 'pending' ? 'Sending 6.4. QC is still at 6.2'
      : s === 'confirmed' ? 'Confirmed by the QC'
      : 'Not applied. Scene changed first, so the QC kept 6.2';
    const chip = { height: '64px', boxSizing: 'border-box', padding: '0 12px', display: 'flex', flexDirection: 'column', alignItems: 'flex-start', justifyContent: 'center', gap: '2px', borderRadius: '18px', border: '2px solid transparent', background: 'oklch(1 0 0 / 0.08)' };
    const mk = (name, value, opts = {}) => ({ name, value, pressed: opts.active ? 'true' : 'false', tag: opts.tag || '',
      tagStyle: opts.tag ? { fontSize: '10px', fontWeight: 600, padding: '1px 5px', borderRadius: '5px', background: 'oklch(1 0 0 / 0.16)', color: 'oklch(0.97 0.01 27)' } : { display: 'none' },
      style: opts.active ? { ...chip, background: 'oklch(1 0 0 / 0.2)', border: '2px solid oklch(0.97 0.01 27)' } : chip });
    return {
      value: shown.toFixed(1),
      gaugeLabel: 'Gain ' + shown.toFixed(1) + ' of 10' + (s === 'pending' ? ', sending, QC at 6.2' : ''),
      trackD: arc(0, 10),
      solidD: arc(0, s === 'pending' ? 6.2 : confirmed),
      provD: s === 'pending' ? arc(6.2, 6.4) : arc(0, 0.001),
      provOpacity: s === 'pending' ? 1 : 0,
      tick: { x1: i.x, y1: i.y, x2: o.x, y2: o.y },
      thumb: pt(shown),
      isPending: s === 'pending', isConfirmed: s === 'confirmed', isRejected: s === 'rejected',
      status,
      statusStyle: { ...statusBase, color: s === 'rejected' ? 'oklch(0.88 0.13 80)' : 'oklch(0.97 0.01 27)' },
      chips: [
        mk('Gain', shown.toFixed(1), { active: true }),
        mk('Bass', '5.0'),
        mk('Mid', '6.5', { tag: 'QC' }),
        mk('Treble', '5.8'),
        mk('Presence', '4.0'),
        mk('Master', '7.0')
      ]
    };
  }
}
</script>
</body>
</html>
