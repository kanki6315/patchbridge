<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Floorboard: preset overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.87 0.17 115)}a:hover{color:oklch(0.93 0.12 115)}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: oklch(0.14 0.006 110); color: oklch(0.96 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <header style="position: absolute; top: 0; left: 0; right: 0; z-index: 2; box-sizing: border-box; padding: 54px 16px 14px; display: flex; flex-direction: column; gap: 10px; background: oklch(0.17 0.006 110 / 0.7); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-bottom: 1px solid oklch(1 0 0 / 0.08);">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <button type="button" style="height: 44px; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 2px; border: 0; border-radius: 22px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.14); font-size: 15px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        Presets
      </button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;">
        <span style="font-size: 17px; font-weight: 600; white-space: nowrap;">Clean Edge Lead</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: oklch(0.78 0.01 110);">
          3B
          <span style="display: inline-flex; align-items: center; gap: 4px; color: oklch(0.87 0.17 115);"><span style="width: 7px; height: 7px; border-radius: 50%; background: currentColor;"></span>Edited</span>
        </span>
      </div>
      <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5);">Save</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: oklch(0.78 0.01 110);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.87 0.17 115)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      <span>Studio Mac · QC connected · CorOS 4.1.1</span>
    </div>
  </header>

  <main style="position: absolute; top: 158px; left: 0; right: 0; display: flex; flex-direction: column; gap: 22px;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; justify-content: space-between; padding: 0 16px; font-size: 13px;">
          <span style="font-weight: 600;">{{row.label}}</span>
          <span style="color: oklch(0.74 0.01 110);">{{row.count}}</span>
        </div>
        <div style="position: relative; display: flex; gap: 10px; padding: 0 16px; overflow: hidden;">
          <div style="position: absolute; left: 16px; right: 0; top: 27px; height: 2px; background: oklch(0.34 0.01 110);"></div>
          <sc-for list="{{row.tiles}}" as="t" hint-placeholder-count="5">
            <div style="position: relative; flex: none; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 7px;">
              <button type="button" aria-label="{{t.aria}}" style="{{t.tileStyle}}">
                <span style="{{t.codeStyle}}">{{t.code}}</span>
                <span style="{{t.markStyle}}">{{t.mark}}</span>
              </button>
              <span style="{{t.nameStyle}}">{{t.name}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div style="margin: 0 16px; height: 46px; display: flex; align-items: center; justify-content: center; border: 1.5px dashed oklch(0.34 0.01 110); border-radius: 14px; font-size: 13px; color: oklch(0.74 0.01 110);">Rows 3 and 4 are empty</div>

    <section aria-label="Selected block" style="margin: 0 16px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; border-radius: 22px; background: oklch(0.2 0.008 110); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.06);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: oklch(0.56 0.2 27); color: #fff; font-size: 11px; font-weight: 700;">AMP</span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0;">
          <span style="font-size: 15px; font-weight: 600;">Crunch 50</span>
          <span style="font-size: 12px; color: oklch(0.74 0.01 110);">Amp · Row 1, slot 3</span>
        </div>
        <button type="button" style="height: 44px; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 2px; border: 0; border-radius: 22px; background: oklch(1 0 0 / 0.08); font-size: 15px;">
          Edit
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: oklch(0.74 0.01 110);">Gain</span>
          <span style="font-size: 22px; font-weight: 600;">6.2</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: oklch(0.74 0.01 110);">Mid</span>
          <span style="font-size: 22px; font-weight: 600;">6.5</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: oklch(0.74 0.01 110);">Master</span>
          <span style="font-size: 22px; font-weight: 600;">7.0</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid oklch(1 0 0 / 0.07); font-size: 13px; color: oklch(0.8 0.01 110);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        Mid was turned on the QC: now 6.5
      </div>
    </section>
  </main>

  <nav aria-label="Scenes" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; box-sizing: border-box; padding: 12px 16px 34px; display: flex; gap: 8px; background: oklch(0.17 0.006 110 / 0.7); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-top: 1px solid oklch(1 0 0 / 0.08);">
    <button type="button" aria-pressed="true" style="flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 18px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5);">
      <span style="font-size: 17px; font-weight: 700;">A</span><span style="font-size: 11px; font-weight: 500;">Rhythm</span>
    </button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 18px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12);">
      <span style="font-size: 17px; font-weight: 700;">B</span><span style="font-size: 11px; color: oklch(0.8 0.01 110);">Lead</span>
    </button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 18px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12);">
      <span style="font-size: 17px; font-weight: 700;">C</span><span style="font-size: 11px; color: oklch(0.8 0.01 110);">Clean</span>
    </button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 18px; background: oklch(1 0 0 / 0.08); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.12);">
      <span style="font-size: 17px; font-weight: 700;">D</span><span style="font-size: 11px; color: oklch(0.8 0.01 110);">Swell</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cat = {
      CMP: { bg: 'oklch(0.68 0.12 160)', ink: 'oklch(0.17 0.02 160)', kind: 'Compressor' },
      DRV: { bg: 'oklch(0.76 0.16 65)', ink: 'oklch(0.2 0.04 65)', kind: 'Drive' },
      AMP: { bg: 'oklch(0.56 0.2 27)', ink: '#ffffff', kind: 'Amp' },
      CAB: { bg: 'oklch(0.52 0.05 50)', ink: '#ffffff', kind: 'Cab' },
      MOD: { bg: 'oklch(0.58 0.18 330)', ink: '#ffffff', kind: 'Modulation' },
      DLY: { bg: 'oklch(0.7 0.14 245)', ink: 'oklch(0.18 0.04 245)', kind: 'Delay' },
      REV: { bg: 'oklch(0.82 0.09 210)', ink: 'oklch(0.2 0.03 210)', kind: 'Reverb' }
    };
    const base = { width: '56px', height: '56px', boxSizing: 'border-box', borderRadius: '16px', border: '0', padding: '0', position: 'relative', zIndex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '1px' };
    const nameStyle = { width: '60px', fontSize: '11px', textAlign: 'center', color: 'oklch(0.8 0.01 110)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' };
    const tile = (code, name, opts = {}) => {
      const c = cat[code];
      if (opts.off) {
        return { code, name, mark: 'OFF', aria: name + ', bypassed',
          tileStyle: { ...base, background: 'oklch(0.14 0.006 110)', border: '2px dashed ' + c.bg },
          codeStyle: { fontSize: '12px', fontWeight: 700, color: 'oklch(0.8 0.01 110)', textDecoration: 'line-through' },
          markStyle: { fontSize: '9px', fontWeight: 600, color: 'oklch(0.8 0.01 110)' },
          nameStyle: { ...nameStyle, color: 'oklch(0.7 0.01 110)' } };
      }
      return { code, name, mark: '', aria: c.kind + ': ' + name + (opts.selected ? ', selected' : ''),
        tileStyle: { ...base, background: c.bg, boxShadow: 'inset 0 1px 0 oklch(1 0 0 / 0.4), inset 0 -10px 18px oklch(0 0 0 / 0.14), 0 6px 14px oklch(0 0 0 / 0.35)', outline: opts.selected ? '2.5px solid oklch(0.87 0.17 115)' : 'none', outlineOffset: '3px' },
        codeStyle: { fontSize: '12px', fontWeight: 700, letterSpacing: '0.02em', color: c.ink },
        markStyle: { display: 'none' },
        nameStyle: opts.selected ? { ...nameStyle, color: 'oklch(0.96 0.005 110)', fontWeight: 600 } : nameStyle };
    };
    const empty = () => ({ code: '+', name: 'Empty', mark: '', aria: 'Empty slot',
      tileStyle: { ...base, background: 'oklch(0.14 0.006 110)', border: '1.5px dashed oklch(0.38 0.01 110)' },
      codeStyle: { fontSize: '20px', fontWeight: 400, color: 'oklch(0.6 0.01 110)' },
      markStyle: { display: 'none' },
      nameStyle: { ...nameStyle, color: 'oklch(0.6 0.01 110)' } });
    return {
      rows: [
        { label: 'Row 1', count: '4 blocks', tiles: [tile('CMP', 'Compressor'), tile('DRV', 'Overdrive'), tile('AMP', 'Crunch 50', { selected: true }), tile('CAB', '4×12 Cab'), empty(), empty()] },
        { label: 'Row 2', count: '3 blocks', tiles: [tile('MOD', 'Chorus', { off: true }), tile('DLY', 'Tape Echo'), tile('REV', 'Plate'), empty(), empty(), empty()] }
      ]
    };
  }
}
</script>
</body>
</html>
