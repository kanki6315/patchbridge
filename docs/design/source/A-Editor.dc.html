<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Floorboard: block editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.87 0.17 115)}a:hover{color:oklch(0.93 0.12 115)}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: oklch(0.14 0.006 110); color: oklch(0.96 0.005 110); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <div aria-hidden="true" style="position: absolute; top: 58px; left: 16px; right: 0; display: flex; gap: 10px; opacity: 0.55;">
    <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: oklch(0.68 0.12 160);"></div>
    <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: oklch(0.76 0.16 65);"></div>
    <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: oklch(0.56 0.2 27);"></div>
    <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: oklch(0.52 0.05 50);"></div>
    <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: oklch(0.7 0.14 245);"></div>
    <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: oklch(0.82 0.09 210);"></div>
  </div>

  <section aria-label="Crunch 50 parameters" style="position: absolute; top: 96px; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 0 0; display: flex; flex-direction: column; border-radius: 34px 34px 0 0; background: oklch(0.2 0.008 110 / 0.82); backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), 0 -12px 40px oklch(0 0 0 / 0.5);">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: oklch(1 0 0 / 0.3);"></div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px 16px; border-bottom: 1px solid oklch(1 0 0 / 0.07);">
      <span style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 13px; background: oklch(0.56 0.2 27); color: #fff; font-size: 12px; font-weight: 700; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.4);">AMP</span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Crunch 50</h1>
        <span style="font-size: 12px; color: oklch(0.78 0.01 110);">Row 1, slot 3 · Scene A</span>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: oklch(0.85 0.01 110);">
        Active
        <button type="button" role="switch" aria-checked="true" aria-label="Block active" style="width: 51px; height: 31px; padding: 2px; border: 0; border-radius: 16px; background: oklch(0.87 0.17 115); display: flex; justify-content: flex-end;">
          <span style="width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px oklch(0 0 0 / 0.3);"></span>
        </button>
      </label>
    </div>

    <div style="display: flex; flex-direction: column; padding: 4px 16px 0;">
      <sc-for list="{{params}}" as="p" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0 8px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 15px;">
              {{p.name}}
              <span style="{{p.tagStyle}}">{{p.tag}}</span>
            </span>
            <button type="button" aria-label="{{p.aria}}" style="{{p.valueStyle}}">{{p.value}}</button>
          </div>
          <div style="position: relative; height: 26px;">
            <div style="position: absolute; left: 0; right: 0; top: 10px; height: 6px; border-radius: 3px; background: oklch(1 0 0 / 0.12);"></div>
            <div style="{{p.fillStyle}}"></div>
            <div style="{{p.ghostStyle}}"></div>
            <div style="{{p.thumbStyle}}"></div>
          </div>
          <sc-if value="{{p.hasStatus}}" hint-placeholder-val="{{false}}">
            <div style="{{p.statusStyle}}">
              <sc-if value="{{p.isPending}}" hint-placeholder-val="{{true}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 3" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>
              </sc-if>
              <sc-if value="{{p.isConfirmed}}" hint-placeholder-val="{{false}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
              </sc-if>
              <sc-if value="{{p.isRejected}}" hint-placeholder-val="{{false}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4"></path><path d="M12 17.5v.5"></path></svg>
              </sc-if>
              <span>{{p.status}}</span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: oklch(0.17 0.006 110 / 0.72); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-top: 1px solid oklch(1 0 0 / 0.08);">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: oklch(0.87 0.01 110);">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(0.87 0.17 115);"></span>
        2 changes not saved
      </span>
      <button type="button" style="height: 48px; padding: 0 24px; border: 0; border-radius: 24px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); font-size: 16px; font-weight: 600; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5);">Save preset</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"editState":{"editor":"enum","options":["pending","confirmed","rejected"],"default":"pending","section":"Edit state"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.editState ?? 'pending';
    const fillColor = 'oklch(0.68 0.19 27)';
    const pct = (v, lo, hi) => ((v - lo) / (hi - lo)) * 100;
    const chip = { minWidth: '64px', height: '36px', padding: '0 12px', boxSizing: 'border-box', borderRadius: '11px', background: 'oklch(1 0 0 / 0.08)', border: '1.5px solid transparent', fontSize: '17px', fontWeight: 600, textAlign: 'right' };
    const noTag = { display: 'none' };
    const row = (name, v, lo, hi, fmt, extra = {}) => {
      const shown = extra.shown ?? v;
      const p = pct(shown, lo, hi);
      return {
        name, value: fmt(shown), aria: name + ' ' + fmt(shown) + ', tap for exact entry',
        tag: extra.tag || '', tagStyle: extra.tag ? { fontSize: '11px', fontWeight: 500, padding: '2px 7px', borderRadius: '6px', background: 'oklch(1 0 0 / 0.1)', color: 'oklch(0.85 0.01 110)' } : noTag,
        valueStyle: extra.valueStyle || chip,
        fillStyle: { position: 'absolute', left: '0', top: '10px', height: '6px', borderRadius: '3px', width: p + '%', background: fillColor, opacity: extra.provisional ? 0.6 : 1 },
        ghostStyle: extra.ghost != null ? { position: 'absolute', top: '4px', width: '3px', height: '18px', borderRadius: '2px', left: 'calc(' + pct(extra.ghost, lo, hi) + '% - 1.5px)', background: 'oklch(0.96 0.005 110)' } : { display: 'none' },
        thumbStyle: { position: 'absolute', top: '0', width: '26px', height: '26px', borderRadius: '50%', left: 'calc(' + p + '% - 13px)', background: '#fff', boxShadow: '0 2px 8px oklch(0 0 0 / 0.45)', border: extra.provisional ? '2px dashed oklch(0.87 0.17 115)' : '0', boxSizing: 'border-box' },
        hasStatus: !!extra.status, status: extra.status || '', statusStyle: extra.statusStyle || {},
        isPending: s === 'pending', isConfirmed: s === 'confirmed', isRejected: s === 'rejected'
      };
    };
    const n1 = (v) => v.toFixed(1);
    const db = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + ' dB';
    const statusBase = { display: 'flex', alignItems: 'center', gap: '6px', fontSize: '13px' };
    let gain;
    if (s === 'pending') {
      gain = row('Gain', 6.2, 0, 10, n1, { shown: 6.4, ghost: 6.2, provisional: true,
        valueStyle: { ...chip, border: '1.5px dashed oklch(0.87 0.17 115)' },
        status: 'Sending 6.4. QC is still at 6.2', statusStyle: { ...statusBase, color: 'oklch(0.87 0.17 115)' } });
    } else if (s === 'confirmed') {
      gain = row('Gain', 6.4, 0, 10, n1, { status: 'Confirmed by the QC', statusStyle: { ...statusBase, color: 'oklch(0.87 0.17 115)' } });
    } else {
      gain = row('Gain', 6.2, 0, 10, n1, {
        valueStyle: { ...chip, border: '1.5px solid oklch(0.8 0.14 70)' },
        status: 'Not applied. Scene changed first, so the QC kept 6.2', statusStyle: { ...statusBase, color: 'oklch(0.82 0.14 70)' } });
    }
    return {
      params: [
        gain,
        row('Bass', 5.0, 0, 10, n1),
        row('Mid', 6.5, 0, 10, n1, { tag: 'Set on QC' }),
        row('Treble', 5.8, 0, 10, n1),
        row('Presence', 4.0, 0, 10, n1),
        row('Master', 7.0, 0, 10, n1),
        row('Level', -3.0, -20, 6, db)
      ]
    };
  }
}
</script>
</body>
</html>
