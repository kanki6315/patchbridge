<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Combined: block editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.87 0.17 115)}a:hover{color:oklch(0.93 0.12 115)}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 16px 0; display: flex; flex-direction: column; background: radial-gradient(120% 60% at 50% 30%, oklch(0.3 0.07 27 / 0.75), transparent 70%), oklch(0.16 0.012 27); color: oklch(0.97 0.006 27); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="D-Overview.dc.html" style="height: 44px; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 2px; border-radius: 22px; background: oklch(1 0 0 / 0.1); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), inset 0 0 0 1px oklch(1 0 0 / 0.06); color: inherit; text-decoration: none; font-size: 15px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Clean Edge Lead
    </a>
    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
      Active
      <button type="button" role="switch" aria-checked="true" aria-label="Block active" style="width: 51px; height: 31px; padding: 2px; border: 0; border-radius: 16px; background: oklch(0.87 0.17 115); display: flex; justify-content: flex-end;">
        <span style="width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px oklch(0 0 0 / 0.3);"></span>
      </button>
    </label>
  </div>

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px;">
    <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: oklch(0.56 0.2 27); color: #fff; font-size: 11px; font-weight: 700; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.4);">AMP</span>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.1; font-weight: 700; letter-spacing: -0.015em;">Crunch 50</h1>
      <span style="font-size: 13px; color: oklch(0.82 0.02 27);">Row 1, slot 3 · Scene A</span>
    </div>
  </div>

  <div style="position: relative; margin-top: 16px; display: flex; flex-direction: column; align-items: center;">
    <span style="font-size: 19px; font-weight: 600;">Gain</span>
    <div style="position: relative; width: 240px; height: 222px;">
      <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="{{gaugeLabel}}" style="position: absolute; top: 0; left: 0;">
        <path d="{{trackD}}" fill="none" stroke="oklch(1 0 0 / 0.13)" stroke-width="16" stroke-linecap="round"></path>
        <path d="{{solidD}}" fill="none" stroke="oklch(0.74 0.16 27)" stroke-width="16" stroke-linecap="round"></path>
        <path d="{{provD}}" fill="none" stroke="oklch(0.74 0.16 27)" stroke-width="16" stroke-dasharray="3 6" opacity="{{provOpacity}}"></path>
        <line x1="{{tick.x1}}" y1="{{tick.y1}}" x2="{{tick.x2}}" y2="{{tick.y2}}" stroke="oklch(0.97 0.006 27)" stroke-width="3" stroke-linecap="round" opacity="{{provOpacity}}"></line>
        <circle cx="{{thumb.x}}" cy="{{thumb.y}}" r="13" fill="#ffffff" stroke="oklch(0.16 0.012 27)" stroke-width="3"></circle>
      </svg>
      <button type="button" aria-label="{{valueAria}}" style="{{valueStyle}}">
        <span style="font-size: 62px; line-height: 1; font-weight: 700; letter-spacing: -0.02em;">{{value}}</span>
        <sc-if value="{{typing}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" style="width: 3px; height: 54px; margin-left: 2px; border-radius: 2px; background: oklch(0.87 0.17 115);"></span>
        </sc-if>
      </button>
      <span style="position: absolute; left: 0; right: 0; top: 152px; text-align: center; font-size: 13px; color: oklch(0.82 0.02 27);">{{valueHint}}</span>
    </div>
    <button type="button" aria-label="Decrease gain by 0.1" style="position: absolute; left: 0; top: 196px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(1 0 0 / 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(1 0 0 / 0.06);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
    </button>
    <button type="button" aria-label="Increase gain by 0.1" style="position: absolute; right: 0; top: 196px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: oklch(1 0 0 / 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(1 0 0 / 0.06);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
    </button>
    <div style="{{statusStyle}}">
      <sc-if value="{{isPending}}" hint-placeholder-val="{{true}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3 3" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>
      </sc-if>
      <sc-if value="{{isConfirmed}}" hint-placeholder-val="{{false}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      </sc-if>
      <sc-if value="{{isRejected}}" hint-placeholder-val="{{false}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4"></path><path d="M12 17.5v.5"></path></svg>
      </sc-if>
      <span>{{status}}</span>
    </div>
  </div>

  <sc-if value="{{notTyping}}" hint-placeholder-val="{{true}}">
    <div role="group" aria-label="Parameters" style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
        <button type="button" aria-pressed="{{t.pressed}}" aria-label="{{t.aria}}" style="{{t.style}}">
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; color: oklch(0.86 0.015 27);">{{t.name}}<span style="{{t.tagStyle}}">{{t.tag}}</span></span>
          <span style="{{t.valueStyle}}">{{t.value}}</span>
        </button>
      </sc-for>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: oklch(0.2 0.02 27 / 0.6); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-top: 1px solid oklch(1 0 0 / 0.08);">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(0.87 0.17 115);"></span>
        2 changes not saved
      </span>
      <button type="button" style="height: 50px; padding: 0 24px; border: 0; border-radius: 25px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); font-size: 16px; font-weight: 600; box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5);">Save to 3B</button>
    </div>
  </sc-if>

  <sc-if value="{{typing}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-label="Type a gain value" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 8px 34px; display: flex; flex-direction: column; gap: 8px; border-radius: 28px 28px 0 0; background: oklch(0.22 0.012 27 / 0.72); backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.16), 0 -10px 30px oklch(0 0 0 / 0.4);">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px;">
        <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; font-size: 16px;">Cancel</button>
        <span style="font-size: 13px; color: oklch(0.82 0.02 27);">0.0 to 10.0, step 0.1</span>
        <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: oklch(0.87 0.17 115); color: oklch(0.2 0.04 115); font-size: 16px; font-weight: 600;">Set</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button type="button" aria-label="{{k.aria}}" style="height: 48px; border: 0; border-radius: 12px; background: oklch(1 0 0 / 0.12); box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.1); font-size: 24px; font-weight: 400;">{{k.label}}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"editState":{"editor":"enum","options":["pending","confirmed","rejected"],"default":"pending","section":"Edit state"},"typing":{"editor":"boolean","default":false,"section":"Edit state"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.editState ?? 'pending';
    const typing = this.props.typing ?? false;
    const cx = 120, cy = 120, r = 96;
    const ang = (v) => (135 + (v / 10) * 270) * Math.PI / 180;
    const pt = (v, rad = r) => ({ x: +(cx + rad * Math.cos(ang(v))).toFixed(2), y: +(cy + rad * Math.sin(ang(v))).toFixed(2) });
    const arc = (a, b) => {
      const p0 = pt(a), p1 = pt(b);
      const large = (b - a) / 10 * 270 > 180 ? 1 : 0;
      return 'M ' + p0.x + ' ' + p0.y + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1.x + ' ' + p1.y;
    };
    const confirmed = s === 'confirmed' ? 6.4 : 6.2;
    const shown = s === 'pending' ? 6.4 : confirmed;
    const pend = s === 'pending' && !typing;
    const i = pt(6.2, 80), o = pt(6.2, 112);
    const status = typing ? 'Nothing is sent until you tap Set'
      : s === 'pending' ? 'Sending 6.4. QC is still at 6.2'
      : s === 'confirmed' ? 'Confirmed by the QC'
      : 'Not applied. Scene changed first, so the QC kept 6.2';
    const vBase = { position: 'absolute', left: '50%', top: '72px', transform: 'translateX(-50%)', height: '76px', padding: '0 14px', display: 'flex', alignItems: 'center', border: '0', borderRadius: '20px', background: 'transparent' };
    const tile = { height: '62px', boxSizing: 'border-box', padding: '0 12px', display: 'flex', flexDirection: 'column', alignItems: 'flex-start', justifyContent: 'center', gap: '2px', borderRadius: '18px', border: '1.5px solid transparent', background: 'oklch(1 0 0 / 0.08)', boxShadow: 'inset 0 1px 0 oklch(1 0 0 / 0.12)', backdropFilter: 'blur(20px) saturate(1.6)', WebkitBackdropFilter: 'blur(20px) saturate(1.6)' };
    const mk = (name, value, opts = {}) => ({ name, value, pressed: opts.active ? 'true' : 'false', tag: opts.tag || '',
      aria: name + ', ' + value + (opts.kind ? ', ' + opts.kind : ''),
      tagStyle: opts.tag ? { fontSize: '10px', fontWeight: 600, padding: '1px 5px', borderRadius: '5px', background: 'oklch(1 0 0 / 0.14)' } : { display: 'none' },
      valueStyle: { fontSize: opts.small ? '16px' : '20px', fontWeight: 600, color: opts.muted ? 'oklch(0.82 0.02 27)' : 'inherit' },
      style: opts.active ? { ...tile, background: 'oklch(0.74 0.16 27 / 0.22)', border: '1.5px solid oklch(0.74 0.16 27)' } : tile });
    const k = (label, aria) => ({ label, aria: aria || label });
    return {
      typing, notTyping: !typing,
      value: typing ? '6.4' : shown.toFixed(1),
      valueAria: 'Gain ' + shown.toFixed(1) + '. Tap to type a value',
      valueStyle: typing ? { ...vBase, background: 'oklch(1 0 0 / 0.1)', boxShadow: 'inset 0 0 0 2px oklch(0.87 0.17 115)' }
        : pend ? { ...vBase, outline: '1.5px dashed oklch(0.87 0.17 115)', outlineOffset: '-1.5px' }
        : vBase,
      valueHint: typing ? 'Typing' : 'Tap number to type',
      gaugeLabel: 'Gain ' + shown.toFixed(1) + ' of 10' + (pend ? ', sending, QC at 6.2' : ''),
      trackD: arc(0, 10),
      solidD: arc(0, pend ? 6.2 : confirmed),
      provD: pend ? arc(6.2, 6.4) : arc(0, 0.001),
      provOpacity: pend ? 1 : 0,
      tick: { x1: i.x, y1: i.y, x2: o.x, y2: o.y },
      thumb: pt(shown),
      isPending: pend || typing, isConfirmed: s === 'confirmed' && !typing, isRejected: s === 'rejected' && !typing,
      status,
      statusStyle: { marginTop: '8px', minHeight: '20px', display: 'flex', alignItems: 'center', gap: '6px', fontSize: '14px', fontWeight: 500, color: s === 'rejected' && !typing ? 'oklch(0.86 0.13 75)' : pend ? 'oklch(0.87 0.17 115)' : 'oklch(0.97 0.006 27)' },
      tiles: [
        mk('Gain', shown.toFixed(1), { active: true }),
        mk('Bass', '5.0'),
        mk('Mid', '6.5', { tag: 'QC' }),
        mk('Treble', '5.8'),
        mk('Presence', '4.0'),
        mk('Master', '7.0'),
        mk('Channel', 'Crunch', { small: true, kind: 'option list' }),
        mk('Bright', 'Off', { small: true, muted: true, kind: 'switch' }),
        mk('Level', '−3.0 dB', { small: true })
      ],
      keys: [k('1'), k('2'), k('3'), k('4'), k('5'), k('6'), k('7'), k('8'), k('9'), k('.', 'Decimal point'), k('0'), k('⌫', 'Delete')]
    };
  }
}
</script>
</body>
</html>
