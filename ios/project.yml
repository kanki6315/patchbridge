name: Patchbridge
options:
  bundleIdPrefix: com.arjunakankipati
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TDBAHN96B3
targets:
  Patchbridge:
    type: application
    platform: iOS
    sources:
      - Patchbridge
      - path: ../tests/fixtures/qc-editor.json
        buildPhase: resources
      - ../swift/Sources/PatchbridgeCore/BLECentral.swift
      - ../swift/Sources/PatchbridgeCore/Chunks.swift
      - ../swift/Sources/PatchbridgeCore/CommandExchange.swift
      - ../swift/Sources/PatchbridgeCore/EditorModel.swift
      - ../swift/Sources/PatchbridgeCore/DeviceIdentity.swift
      - ../swift/Sources/PatchbridgeCore/GenericEditor.swift
      - ../swift/Sources/PatchbridgeCore/EditorCoordinator.swift
      - ../swift/Sources/PatchbridgeCore/Diagnostics.swift
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.arjunakankipati.patchbridge
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Patchbridge
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to your Mac to view and edit your Quad Cortex preset over Bluetooth.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '0.1'
  PatchbridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PatchbridgeUITests]
    dependencies:
      - target: Patchbridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Patchbridge:
    build:
      targets:
        Patchbridge: all
    run:
      config: Debug
    test:
      targets: [PatchbridgeUITests]
