name: Patchbridge
options:
  bundleIdPrefix: dev.patchbridge
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TDBAHN96B3
targets:
  Patchbridge:
    type: application
    platform: iOS
    sources:
      - Patchbridge
      - ../swift/Sources/PatchbridgeCore/BLECentral.swift
      - ../swift/Sources/PatchbridgeCore/Chunks.swift
      - ../swift/Sources/PatchbridgeCore/CommandExchange.swift
      - ../swift/Sources/PatchbridgeCore/EditorModel.swift
      - ../swift/Sources/PatchbridgeCore/DeviceIdentity.swift
      - ../swift/Sources/PatchbridgeCore/GenericEditor.swift
      - ../swift/Sources/PatchbridgeCore/EditorCoordinator.swift
      - ../swift/Sources/PatchbridgeCore/Diagnostics.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.patchbridge.phone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Patchbridge
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to your Mac to edit a simulated guitar preset over Bluetooth.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '0.1'
schemes:
  Patchbridge:
    build:
      targets:
        Patchbridge: all
    run:
      config: Debug
